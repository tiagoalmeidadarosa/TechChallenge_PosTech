---
apiVersion: v1
kind: Service
metadata:
  labels:
    io.kompose.service: tech-challenge-api-consumer
  name: tech-challenge-api-consumer
spec:
  ports:
    - name: "5000"
      port: 5000
      targetPort: 5000
  selector:
    io.kompose.service: tech-challenge-api-consumer
---

apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: tech-challenge-api-consumer
  name: tech-challenge-api-consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: tech-challenge-api-consumer
  template:
    metadata:
      labels:
        io.kompose.service: tech-challenge-api-consumer
    spec:
      containers:
        - env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ASPNETCORE_HTTP_PORTS
              value: "5000"
          image: tech-challenge-api-consumer
          name: tech-challenge-api-consumer
          ports:
            - containerPort: 5000
              protocol: TCP
      restartPolicy: Always
