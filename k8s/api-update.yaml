---
apiVersion: v1
kind: Service
metadata:
  labels:
    io.kompose.service: tech-challenge-api-update
  name: tech-challenge-api-update
spec:
  ports:
    - name: "5003"
      port: 5003
      targetPort: 5003
  selector:
    io.kompose.service: tech-challenge-api-update

---

apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: tech-challenge-api-update
  name: tech-challenge-api-update
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: tech-challenge-api-update
  template:
    metadata:
      labels:
        io.kompose.service: tech-challenge-api-update
    spec:
      containers:
        - env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ASPNETCORE_HTTP_PORTS
              value: "5003"
          image: tiagoalmeidadarosa/tech-challenge-api-update
          name: tech-challenge-api-update
          ports:
            - containerPort: 5003
              protocol: TCP
      restartPolicy: Always
